name: Compilar DSi IA Chat

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20241104

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar
        run: make

      - name: Subir archivo NDS
        uses: actions/upload-artifact@v4
        with:
          name: DSi_IA_Chat
          path: DSi_IA_Chat.nds
